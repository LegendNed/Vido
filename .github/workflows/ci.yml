name: CI

# Manual only: Actions → CI → "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch FFmpeg dev build
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Lint, format check, typecheck + build, cargo fmt check, clippy, tests.
      # GPU capture tests are #[ignore]d (CI has no display/GPU).
      - name: CI checks
        run: pnpm check

      - name: Build installer
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: vido-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
