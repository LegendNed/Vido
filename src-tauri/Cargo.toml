[package]
name = "vido"
version = "1.0.0"
description = "Local-first replay buffer and clip editor"
authors = ["Vido contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "vido_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.14"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
file-rotate = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ts-rs = "12"
nnnoiseless = { version = "0.5", default-features = false }
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

ffmpeg-sys-next = { version = "=8.1.0", default-features = false, features = ["avcodec", "avfilter", "avformat", "swresample", "swscale"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# The updater's signature format, for the update test.
minisign-verify = "0.3"
base64 = "0.22"

[profile.dev]
# Keep debug builds usable for realtime capture/encode work.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# 16 (Rust's default) lets the last, largest crate (vido) compile on 16 threads; 1 would
# squeeze slightly more speed out of the binary but builds it on a single core.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
